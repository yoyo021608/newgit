version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: knowledge_mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: knowledge_base
      MYSQL_CHARSET: utf8mb4
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    restart: always

  backend:
    build: .
    container_name: knowledge_backend
    depends_on:
      - mysql
    environment:
      DATABASE_URL: mysql+pymysql://root:123456@mysql:3306/knowledge_base?charset=utf8mb4
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
    ports:
      - "8001:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
    restart: always

volumes:
  mysql_data: